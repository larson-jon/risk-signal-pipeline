name: Test Decoding and Commit Outputs

permissions:
  contents: write

on:
  workflow_dispatch:  # manual trigger

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run enterprise scraper
        run: python news_sentiment_scraper.py --risk-type enterprise

      - name: Run emerging scraper
        run: python news_sentiment_scraper.py --risk-type emerging

      - name: Commit and push output CSVs
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions@users.noreply.github.com"
          git add --ignore-errors output/*_online_sentiment.csv || true
          git commit -m "Update sentiment CSVs - $(date +'%Y-%m-%d %H:%M')" || echo "No changes to commit"
          git push origin main || echo "Push failed"
