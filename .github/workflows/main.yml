name: Daily News Sentiment Update

on:
  schedule:
    - cron: "0 9 * * *"  # runs daily at 9:00 UTC = 4:00 AM Eastern
  workflow_dispatch:     # allows manual trigger from GitHub UI
    inputs:
      risk_type:
        description: "Which risk type to run"
        required: false
        default: "all"
        type: choice
        options:
          - all
          - enterprise
          - emerging
      debug_mode:
        description: "Enable debug mode"
        required: false
        default: "false"
        type: choice
        options:
          - "true"
          - "false"

jobs:
  run-scraper:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.PERSONAL_ACCESS_TOKEN }}

      - name: Set default risk_type for schedule
        run: echo "RISK_TYPE=${{ github.event.inputs.risk_type || 'all' }}" >> $GITHUB_ENV  # default 'all' if no input

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          python -m spacy download en_core_web_sm

      - name: Download embedding model (offline fallback)
        # Fetches all-MiniLM-L6-v2 from a GitHub mirror so the topic stage does
        # not depend on huggingface.co being reachable at run time.
        run: python download_model.py

      - name: Run enterprise risks
        if: env.RISK_TYPE == 'all' || env.RISK_TYPE == 'enterprise'
        run: python news_sentiment_scraper.py --risk-type enterprise
        env:
          DEBUG_MODE: ${{ github.event.inputs.debug_mode || 'false' }}
          MAX_ARTICLES_PER_TERM: 10
          NEWS_DATA_API_KEY: ${{ secrets.NEWS_DATA_API_KEY }}

      - name: Run emerging risks
        if: env.RISK_TYPE == 'all' || env.RISK_TYPE == 'emerging'
        run: python news_sentiment_scraper.py --risk-type emerging
        env:
          DEBUG_MODE: ${{ github.event.inputs.debug_mode || 'false' }}
          MAX_ARTICLES_PER_TERM: 10
          NEWS_DATA_API_KEY: ${{ secrets.NEWS_DATA_API_KEY }}

      - name: Cluster enterprise risk topics
        if: env.RISK_TYPE == 'all' || env.RISK_TYPE == 'enterprise'
        run: python topic_clustering.py --risk-type enterprise --nr-topics 60
        env:
          DEBUG_MODE: ${{ github.event.inputs.debug_mode || 'false' }}

      - name: Cluster emerging risk topics
        if: env.RISK_TYPE == 'all' || env.RISK_TYPE == 'emerging'
        run: python topic_clustering.py --risk-type emerging --nr-topics 60
        env:
          DEBUG_MODE: ${{ github.event.inputs.debug_mode || 'false' }}

      - name: Build enterprise trends
        if: env.RISK_TYPE == 'all' || env.RISK_TYPE == 'enterprise'
        run: python topic_trends.py --risk-type enterprise

      - name: Build emerging trends
        if: env.RISK_TYPE == 'all' || env.RISK_TYPE == 'emerging'
        run: python topic_trends.py --risk-type emerging

      - name: Score enterprise taxonomy gaps
        if: env.RISK_TYPE == 'all' || env.RISK_TYPE == 'enterprise'
        run: python topic_gaps.py --risk-type enterprise --min-quality 0.6

      - name: Score emerging taxonomy gaps
        if: env.RISK_TYPE == 'all' || env.RISK_TYPE == 'emerging'
        run: python topic_gaps.py --risk-type emerging --min-quality 0.6

      - name: Build enterprise report
        if: env.RISK_TYPE == 'all' || env.RISK_TYPE == 'enterprise'
        run: python build_report.py --risk-type enterprise

      - name: Build emerging report
        if: env.RISK_TYPE == 'all' || env.RISK_TYPE == 'emerging'
        run: python build_report.py --risk-type emerging

      - name: Build report index
        run: python build_index.py

      - name: Commit and push updated data + reports
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions@users.noreply.github.com"
          git add output/*.csv reports/*.html
          git commit -m "Update sentiment data - $(date +'%Y-%m-%d %H:%M')" || echo "No changes to commit"
          git push origin main || echo "No changes to push"
        env:
          GITHUB_TOKEN: ${{ secrets.PERSONAL_ACCESS_TOKEN }}
